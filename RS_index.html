<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laporan Harian Remote Sensing</title>
<style>
  :root{--biru:#0d47a1;--biru2:#1565c0;--mud:#e3f2fd;--line:#90caf9;--teks:#10233b;--bg:#f4f7fb;--merah:#c62828;--abu:#607d8b;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Roboto,"Segoe UI",sans-serif;background:var(--bg);color:var(--teks);font-size:16px}
  button{cursor:pointer}
  header{position:sticky;top:0;z-index:10;background:var(--biru);color:#fff;padding:10px 14px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  header h1{margin:0;font-size:16px} header .sub{font-size:12px;opacity:.9}
  main{max-width:820px;margin:0 auto;padding:12px 12px 80px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .card h2{margin:0 0 10px;font-size:15px;color:var(--biru);display:flex;align-items:center;gap:8px}
  .card h2 .num{background:var(--biru);color:#fff;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
  label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:#274060}
  input,select,textarea{width:100%;padding:11px;border:1.5px solid #c5d9ef;border-radius:10px;font-size:16px;background:#fff;color:var(--teks);-webkit-appearance:none}
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%231565c0' stroke-width='2' fill='none'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:28px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .hint{font-size:12px;color:#5a6b80;margin-top:4px}
  .btn{border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700}
  .btn-main{background:var(--biru);color:#fff}.btn-sec{background:var(--mud);color:var(--biru2);border:1.5px solid var(--line)}
  .auto{background:var(--mud);border-radius:10px;padding:10px;font-size:14px;white-space:pre-wrap;min-height:20px}
  .umgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;text-align:center}
  .umgrid .b{background:var(--mud);border-radius:10px;padding:8px 3px}.umgrid .b b{display:block;color:var(--biru);font-size:15px}.umgrid .b span{font-size:10px;color:#5a6b80}
  #preview{width:100%;min-height:360px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;white-space:pre;overflow:auto}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:#263238;color:#fff;padding:11px 18px;border-radius:24px;font-size:14px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>Laporan Harian Remote Sensing <span style="font-size:11px;opacity:.7">· v1</span></h1>
  <div class="sub" id="subJudul">— pilih tanggal &amp; wilayah —</div>
</header>
<main>
  <div class="card">
    <h2><span class="num">1</span> Ambil Data</h2>
    <div class="grid2">
      <div><label>Tgl Assessment</label><input id="tgl" type="date"></div>
      <div><label>Wilayah</label><select id="wil"><option value="">—</option></select></div>
    </div>
    <button class="btn btn-main" style="width:100%;margin-top:12px" id="btnAmbil" onclick="ambil()">Ambil data UAV</button>
  </div>

  <div class="card">
    <h2><span class="num">2</span> Hasil (otomatis)</h2>
    <div class="umgrid">
      <div class="b"><b id="u02">0</b><span>02</span></div>
      <div class="b"><b id="u06">0</b><span>06</span></div>
      <div class="b"><b id="u12">0</b><span>12</span></div>
      <div class="b"><b id="u24">0</b><span>24</span></div>
      <div class="b"><b id="u36">0</b><span>36</span></div>
      <div class="b"><b id="total">0</b><span>TOTAL</span></div>
    </div>
    <div class="grid2" style="margin-top:8px">
      <div><label>Jam kerja mulai</label><input id="jamMulai" readonly placeholder="—"></div>
      <div><label>Jam kerja selesai</label><input id="jamSelesai" readonly placeholder="—"></div>
    </div>
    <label>Blok (otomatis)</label><div class="auto" id="autoBlocks">—</div>
  </div>

  <div class="card">
    <h2><span class="num">3</span> Input Manual</h2>
    <div class="grid2">
      <div><label>Penanggung Jawab 1</label><select id="pj1"><option value="">—</option></select></div>
      <div><label>Penanggung Jawab 2</label><select id="pj2"><option value="">—</option></select></div>
    </div>
    <label>Jumlah HOK</label><input id="hok" inputmode="numeric" placeholder="0">
    <div class="grid2">
      <div><label>Total target (ha)</label><input id="target" inputmode="decimal" placeholder="0"></div>
      <div><label>Realisasi kumulatif (ha)</label><input id="realisasi" inputmode="decimal" placeholder="0"></div>
    </div>
    <label>Sisa target (ha) — Total target − Realisasi (otomatis)</label><input id="sisa" readonly>
    <div class="hint">Realisasi menambah TOTAL hari ini (1× per tanggal), bisa disesuaikan manual, tersimpan &amp; dibawa ke hari berikutnya.</div>
    <label>Catatan</label><textarea id="catatan" rows="2"></textarea>
    <label>Note</label><textarea id="note" rows="5" placeholder="_Cuaca … _Pencapaian … _Mobil operasional …"></textarea>
  </div>

  <div class="card">
    <h2><span class="num">4</span> Laporan (Pratinjau)</h2>
    <button class="btn btn-main" style="width:100%" onclick="buatLaporan()">Buat Laporan</button>
    <textarea id="preview" readonly placeholder="Tekan 'Buat Laporan'…"></textarea>
    <button class="btn btn-sec" style="width:100%;margin-top:8px" onclick="salin()">📋 Salin ke clipboard</button>
    <button class="btn btn-main" style="width:100%;margin-top:8px" onclick="simpan(this)">💾 Simpan ke Laporan RS</button>
  </div>
</main>
<div id="toast" class="toast"></div>

<script>
var MASTERS={wilayah:[],staffByWil:{},svByWil:{},wilNama:{}};
var LAST=null;
function targetKey(){ return 'pqa_rs_target_'+(wilNum(el('wil').value)||'x'); }
function appliedKey(){ return 'pqa_rs_applied_'+(wilNum(el('wil').value)||'x'); }
function wilNum(w){ return String(w||'').replace(/[^0-9]/g,''); }

document.addEventListener('DOMContentLoaded',function(){
  el('tgl').value=today();
  google.script.run.withSuccessHandler(function(m){ MASTERS=m; fillWilayah(); }).withFailureHandler(function(e){ toast('Master gagal: '+e); }).getMasters();
  el('wil').addEventListener('change', function(){ refreshStaff(); loadTarget(); });
  el('target').addEventListener('input', function(){ saveTarget(); recalcSisa(); });
  el('realisasi').addEventListener('input', function(){ saveTarget(); recalcSisa(); });
});
function fillWilayah(){ var s=el('wil'); s.innerHTML='<option value="">—</option>';
  (MASTERS.wilayah||[]).forEach(function(w){ var o=document.createElement('option'); o.value=w;o.textContent=w;s.appendChild(o); }); }
function curStaff(){ var n=wilNum(el('wil').value); return (MASTERS.staffByWil&&MASTERS.staffByWil[n])||[]; }
function staffOptions(sel){ var s='<option value="">—</option>'; curStaff().forEach(function(x){ s+='<option value="'+x+'"'+(x===sel?' selected':'')+'>'+x+'</option>'; }); return s; }
function refreshStaff(){ ['pj1','pj2'].forEach(function(id){ var cur=el(id).value; el(id).innerHTML=staffOptions(cur); }); }

function loadTarget(){ var o=null; try{ o=JSON.parse(localStorage.getItem(targetKey())||'null'); }catch(e){}
  el('target').value=(o&&o.target)||''; el('realisasi').value=(o&&o.realisasi)||''; recalcSisa(); }
function saveTarget(){ try{ localStorage.setItem(targetKey(), JSON.stringify({target:el('target').value, realisasi:el('realisasi').value})); }catch(e){} }
function recalcSisa(){ el('sisa').value = idr_(numv(el('target').value) - numv(el('realisasi').value)); }

function ambil(){ var tgl=el('tgl').value, wil=el('wil').value;
  if(!tgl||!wil) return toast('Tgl dan Wilayah dulu.');
  var b=el('btnAmbil'); b.disabled=true; b.textContent='Mengambil…';
  google.script.run.withSuccessHandler(function(d){ LAST=d; render(d); b.disabled=false; b.textContent='Ambil data UAV'; })
    .withFailureHandler(function(e){ toast('Gagal: '+e); b.disabled=false; b.textContent='Ambil data UAV'; })
    .getLaporanRS(tgl, wil); }
function render(d){
  el('subJudul').textContent='Laporan Harian RS '+(d.wilayah||'')+' '+(d.wilNama||'');
  el('u02').textContent=idr_(d.umur['02']); el('u06').textContent=idr_(d.umur['06']); el('u12').textContent=idr_(d.umur['12']);
  el('u24').textContent=idr_(d.umur['24']); el('u36').textContent=idr_(d.umur['36']); el('total').textContent=idr_(d.total);
  el('jamMulai').value=d.jamMulai||''; el('jamSelesai').value=d.jamSelesai||'';
  el('autoBlocks').textContent = blocksText(d) || '—';
  loadTarget();
  var tag=d.tanggal;                                   // 当日のTOTALを実績へ1回だけ加算
  if(localStorage.getItem(appliedKey())!==tag){ el('realisasi').value=idr_(numv(el('realisasi').value)+numv(d.total)); localStorage.setItem(appliedKey(),tag); saveTarget(); }
  recalcSisa(); toast('Data UAV dimuat ✓');
}
function blockLine(b,i){
  var L=[]; var strip=b.perbStrip||'';
  if(b.perbAdd&&b.perbAdd.length) strip += (strip?' ':'')+'(+ Perb: '+b.perbAdd.join(', ')+')';
  L.push((i+1)+'. U '+b.umur+' Bulan '+[b.blok,b.compt,b.stand].filter(function(x){return x;}).join(' ')+' '+idr_(b.luas)+' ha');
  if(b.pilot) L.push('   Pilot : '+b.pilot);
  if(b.copilot) L.push('   Co Pilot : '+b.copilot);
  if(strip) L.push('   Perbandingan strip : '+strip);
  L.push('   Jumlah strip = '+(b.jumlahStrip!==''&&b.jumlahStrip!=null?idr_(b.jumlahStrip):'-')+' strip.');
  return L.join('\n');
}
function blocksText(d){ var out=(d.blocks||[]).map(function(b,i){ return blockLine(b,i); });
  (d.perbList||[]).forEach(function(p,i){ out.push((d.blocks.length+i+1)+'. [Perbandingan 2 strip] U '+p.umur+' Bulan '+[p.blok,p.stand].filter(function(x){return x;}).join(' ')+(p.nostrip?' — No Strip '+p.nostrip:'')); });
  return out.join('\n\n'); }

function buatLaporan(){ if(!LAST) return toast('Ambil data UAV dulu.'); el('preview').value=buildText(LAST); toast('Laporan dibuat ✓'); }
function ha(v){ return numv(v)>0 ? idr_(v)+' ha' : ' ha'; }
function buildText(d){ var L=[];
  L.push('Laporan Pencapaian Harian Kegiatan Remote Sensing');
  L.push((d.wilayah||'')+' '+(d.wilNama||'')); L.push('');
  L.push('1. Tgl Assessment: '+tanggalID(d.tanggal)+'.');
  L.push('2. Penanggung Jawab: '+[el('pj1').value,el('pj2').value].filter(function(x){return x;}).join(' & '));
  L.push('3. Jumlah HOK: '+(el('hok').value||'')+' orang');
  L.push('4. 02 bulan: '+ha(d.umur['02']));
  L.push('5. 06 bulan: '+ha(d.umur['06']));
  L.push('6. 12 bulan: '+ha(d.umur['12']));
  L.push('7. 24 bulan: '+ha(d.umur['24']));
  L.push('8. 36 bulan: '+ha(d.umur['36']));
  L.push('9. TOTAL : '+idr_(d.total)+' ha');
  L.push('10. Total target : '+idr_(el('target').value)+' ha');
  L.push('11. Sisa target : '+idr_(el('sisa').value)+' ha');
  L.push('12. catatan : '+(el('catatan').value.trim()));
  L.push('Jam kerja mulai '+(d.jamMulai||'')+' wib');
  L.push('Jam kerja selesai '+(d.jamSelesai||'')+' wib');
  L.push('');
  (d.blocks||[]).forEach(function(b,i){ L.push(blockLine(b,i)); L.push(''); });
  (d.perbList||[]).forEach(function(p,i){ L.push((d.blocks.length+i+1)+'. [Perbandingan 2 strip] U '+p.umur+' Bulan '+[p.blok,p.stand].filter(function(x){return x;}).join(' ')+(p.nostrip?' — No Strip '+p.nostrip:'')); L.push(''); });
  var note=el('note').value.trim(); if(note){ L.push('Note'); L.push(note); L.push(''); }
  L.push('Demikian laporan ini, terima kasih.');
  return L.join('\n'); }

function simpan(b){ if(!LAST) return toast('Ambil data UAV dulu.');
  var d=LAST, teks=el('preview').value||buildText(d);
  var p={ tanggal:d.tanggal, wilayah:d.wilayah, pj:[el('pj1').value,el('pj2').value].filter(function(x){return x;}).join(' & '),
    hok:el('hok').value, u02:d.umur['02'],u06:d.umur['06'],u12:d.umur['12'],u24:d.umur['24'],u36:d.umur['36'], total:d.total,
    totalTarget:numv(el('target').value), realisasi:numv(el('realisasi').value), sisa:numv(el('sisa').value),
    jamMulai:d.jamMulai, jamSelesai:d.jamSelesai, catatan:el('catatan').value, note:el('note').value, blocks:blocksText(d), teks:teks };
  if(b){ b.disabled=true; b.textContent='Menyimpan…'; }
  google.script.run.withSuccessHandler(function(r){ toast(r&&r.updated?'Diperbarui ✓':'Tersimpan ✓'); if(b){b.disabled=false;b.textContent='💾 Simpan ke Laporan RS';} })
    .withFailureHandler(function(e){ toast('Gagal: '+e); if(b){b.disabled=false;b.textContent='💾 Simpan ke Laporan RS';} }).simpanRS(p); }

function salin(){ var t=el('preview'); if(!t.value) return toast('Buat laporan dulu.'); t.select(); t.setSelectionRange(0,99999);
  try{ document.execCommand('copy'); toast('Tersalin ✓'); }catch(e){ if(navigator.clipboard){ navigator.clipboard.writeText(t.value).then(function(){toast('Tersalin ✓');}); } else toast('Gagal menyalin'); } }

function el(id){ return document.getElementById(id); }
function numv(v){ var x=parseFloat(String(v).replace(/\./g,'').replace(',','.')); return isFinite(x)?x:(function(){var y=parseFloat(String(v).replace(',','.'));return isFinite(y)?y:0;})(); }
function idr_(x){ x=(typeof x==='number')?x:numv(x); var neg=x<0; x=Math.abs(x); var r=Math.round(x*100)/100, s=r.toFixed(2), p=s.split('.');
  var dec=p[1].replace(/0+$/,''); var intp=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.'); return (neg?'-':'')+(dec? intp+','+dec : intp); }
function tanggalID(iso){ var d=new Date(iso+'T00:00:00'); var bln=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][d.getMonth()];
  return d.getDate()+' '+bln+' '+d.getFullYear(); }
function today(){ var d=new Date(),m=('0'+(d.getMonth()+1)).slice(-2),day=('0'+d.getDate()).slice(-2); return d.getFullYear()+'-'+m+'-'+day; }
var tT; function toast(m){ var t=el('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tT); tT=setTimeout(function(){t.classList.remove('show');},2600); }
</script>
</body>
</html>
